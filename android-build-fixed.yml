name: Build Android APK

on:
  push:
    branches: [ arena/019f868c-neftegorsk ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ arena/019f868c-neftegorsk ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      EXPORT_NAME: "Android"
      PROJECT_PATH: "./project"
      BUILD_DIR: "./builds"

    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Godot 4.3 + Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O godot.zip
          unzip -o godot.zip
          mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -o templates.tpz
          cp -r templates/* ~/.local/share/godot/export_templates/4.3.stable/
          rm -rf templates

      - name: Create build directory
        run: mkdir -p ${{ env.BUILD_DIR }}

      - name: Install Android SDK + NDK + Debug Keystore
        run: |
          ANDROID_HOME=/opt/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdlinetools.zip
          unzip -o cmdlinetools.zip -d $ANDROID_HOME/cmdline-tools/
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          sdkmanager "ndk;26.1.10909125"
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true

      - name: Validate GDScript syntax (no Python constructs + no duplicate declarations!)
        run: |
          cd ${{ env.PROJECT_PATH }}
          echo "=== Checking for Python-only syntax and GDScript parse errors ==="
          ERRORS=0
          ALL_GD=$(find scenes autoload scripts -name "*.gd" 2>/dev/null | sort)
          for f in $ALL_GD; do
            # Check for triple-quote docstrings
            if grep -q '\"\"\"' "$f" 2>/dev/null; then
              echo "ERROR: $f has triple-quote docstring (Python)"
              ERRORS=$((ERRORS + 1))
            fi
            # Check for def keyword (Python)
            if grep -qP '^\tdef |^def ' "$f" 2>/dev/null; then
              echo "ERROR: $f has def keyword (Python, use func)"
              ERRORS=$((ERRORS + 1))
            fi
            # Check for nonlocal/global
            if grep -qP '^\tnonlocal |^nonlocal |^\tglobal |^global ' "$f" 2>/dev/null; then
              echo "ERROR: $f has nonlocal/global (Python)"
              ERRORS=$((ERRORS + 1))
            fi
            # Check for hasattr
            if grep -q 'hasattr' "$f" 2>/dev/null; then
              echo "ERROR: $f has hasattr() (Python)"
              ERRORS=$((ERRORS + 1))
            fi
            # Check for enumerate
            if grep -q 'enumerate' "$f" 2>/dev/null; then
              echo "ERROR: $f has enumerate() (Python)"
              ERRORS=$((ERRORS + 1))
            fi
            # Check for reversed
            if grep -q 'reversed' "$f" 2>/dev/null; then
              echo "ERROR: $f has reversed() (Python)"
              ERRORS=$((ERRORS + 1))
            fi
            # Check for assert
            if grep -qP '^\tassert |^assert ' "$f" 2>/dev/null; then
              echo "ERROR: $f has assert (Python)"
              ERRORS=$((ERRORS + 1))
            fi
            # Check for duplicate static var declarations (PARSE ERROR in GDScript!)
            DUPES=$(grep -cP '^static var \w+' "$f" 2>/dev/null || echo 0)
            if [ "$DUPES" -gt 1 ]; then
              echo "ERROR: $f has DUPLICATE static var at class level"
              ERRORS=$((ERRORS + 1))
            fi
            # Check for -> Variant return type annotation (PARSE ERROR on Android Godot 4.3!)
            if grep -qP '\-> Variant' "$f" 2>/dev/null; then
              echo "ERROR: $f has -> Variant return type (PARSE ERROR on Android! Remove it)"
              ERRORS=$((ERRORS + 1))
            fi
          done
          echo "=== GDScript syntax check: $ERRORS errors found ==="
          if [ $ERRORS -gt 0 ]; then
            echo "FAIL: Fix syntax errors before building APK!"
            exit 1
          fi
          echo "PASS: No syntax errors found"

      - name: Create textures PCK with PNG source files
        run: |
          cd ${{ env.PROJECT_PATH }}
          echo "=== Creating textures.pck ==="
          python3 pck_packer.py textures.pck .
          ls -la textures.pck

      - name: Create editor_settings manually
        run: |
          mkdir -p ~/.config/godot
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          SETTINGS=~/.config/godot/editor_settings-4.3.tres
          echo '[application]' > "$SETTINGS"
          echo 'config/use_custom_user_dir=true' >> "$SETTINGS"
          echo 'config/custom_user_dir_name="Neftegorsk"' >> "$SETTINGS"
          echo '' >> "$SETTINGS"
          echo '[editor]' >> "$SETTINGS"
          echo 'search/engine=""' >> "$SETTINGS"
          echo '' >> "$SETTINGS"
          echo '[export]' >> "$SETTINGS"
          echo 'android/android_sdk_path = "/opt/android-sdk"' >> "$SETTINGS"
          echo "android/java_sdk_path = \"$JAVA_PATH\"" >> "$SETTINGS"
          echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\"" >> "$SETTINGS"
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> "$SETTINGS"
          echo 'export/android/debug_keystore_pass = "android"' >> "$SETTINGS"
          echo 'export/android/force_system_user = false' >> "$SETTINGS"
          echo 'export/android/timestamping_authority_url = ""' >> "$SETTINGS"
          echo 'export/android/shutdown_adb_on_exit = true' >> "$SETTINGS"

      - name: Generate project.godot (2 autoloads only!) and export_presets.cfg
        run: |
          cd ${{ env.PROJECT_PATH }}
          # WRITE project.godot FROM SCRATCH — only GameState + UIRenderer (Simulation merged into UIRenderer!)
          cat > project.godot << 'GODOTCFG'
          ; Engine configuration file.
          ; GENERATED by CI v22 — Simulation merged into UIRenderer, no separate Simulation autoload!

          [application]

          config/name="Neftegorsk"
          config/icon="res://assets/icons/app_icon.png"
          run/main_scene="res://autoload/boot_loader.tscn"

          [autoload]

          GameState="*res://autoload/game_state.tscn"
          UIRenderer="*res://autoload/ui_renderer.tscn"

          [display]

          window/size/viewport_width=1080
          window/size/viewport_height=1920
          window/size/resizable=true
          window/mode/window_mode=0
          window/vsync/vsync_mode=1

          [rendering]

          rendering_method/renderer="mobile"
          rendering/quality/shadows/shadow_atlas_size=2048
          textures/vram_compression/import_etc2_astc=true

          [input_map]

          touchscreen_tap={
          "deadzone": 0.5,
          "events": [InputEventScreenTouch, 0, true]
          }
          mouse_click={
          "deadzone": 0.5,
          "events": [InputEventMouseButton, 1, true]
          }

          [physics]

          common/physics_ticks_per_second=60

          [android]

          build/min_sdk=21
          build/target_sdk=34
          build/version_code=18
          build/version_name="1.0.18"
          build/package="com.neftegorsk.game"
          build/keystore/debug="user://debug.keystore"
          build/permissions=["android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE", "android.permission.WAKE_LOCK"]
          build/architectures=["arm64-v8a", "armeabi-v7a"]
          GODOTCFG
          # Fix export_presets.cfg
          sed -i 's|use_embedded_pck=false|use_embedded_pck=true|' export_presets.cfg
          sed -i 's|script_export_mode=1|script_export_mode=0|g' export_presets.cfg
          if ! grep -q "script_export_mode" export_presets.cfg; then
            sed -i '/encrypt_pck=false/a script_export_mode=0' export_presets.cfg
          fi
          sed -i '/gdscript_optimization_level/d' export_presets.cfg
          sed -i 's|runnable=false|runnable=true|g' export_presets.cfg
          sed -i 's|export_path="builds/Neftegorsk.apk"|export_path="Neftegorsk.apk"|g' export_presets.cfg
          sed -i 's|include_filter=""|include_filter="textures.pck"|' export_presets.cfg
          echo "=== KEY SETTINGS ==="
          grep "use_embedded_pck" export_presets.cfg
          grep "script_export_mode" export_presets.cfg
          grep "include_filter" export_presets.cfg
          grep "main_scene" project.godot
          echo "=== AUTOLOAD SECTION (2 autoloads!) ==="
          grep -A3 "[autoload]" project.godot

      - name: Import project resources
        run: |
          cd ${{ env.PROJECT_PATH }}
          echo "=== Running --import ==="
          godot --headless --import 2>&1 | tail -10 || true

      - name: Delete PNG .import files (force direct PNG loading at runtime)
        run: |
          cd ${{ env.PROJECT_PATH }}
          echo "=== Deleting .import files ==="
          find . -name "*.png.import" -type f -print -delete || true
          find . -name "*.svg.import" -type f -print -delete || true
          find .godot/imported -name "*.ctex" -type f -print -delete 2>/dev/null || true
          echo "=== Done ==="

      - name: Re-generate project.godot (2 autoloads only!) after import
        run: |
          cd ${{ env.PROJECT_PATH }}
          # RE-WRITE project.godot from scratch after --import
          cat > project.godot << 'GODOTCFG'
          ; Engine configuration file.
          ; GENERATED by CI v22 — Simulation merged into UIRenderer, no separate Simulation autoload!

          [application]

          config/name="Neftegorsk"
          config/icon="res://assets/icons/app_icon.png"
          run/main_scene="res://autoload/boot_loader.tscn"

          [autoload]

          GameState="*res://autoload/game_state.tscn"
          UIRenderer="*res://autoload/ui_renderer.tscn"

          [display]

          window/size/viewport_width=1080
          window/size/viewport_height=1920
          window/size/resizable=true
          window/mode/window_mode=0
          window/vsync/vsync_mode=1

          [rendering]

          rendering_method/renderer="mobile"
          rendering/quality/shadows/shadow_atlas_size=2048
          textures/vram_compression/import_etc2_astc=true

          [input_map]

          touchscreen_tap={
          "deadzone": 0.5,
          "events": [InputEventScreenTouch, 0, true]
          }
          mouse_click={
          "deadzone": 0.5,
          "events": [InputEventMouseButton, 1, true]
          }

          [physics]

          common/physics_ticks_per_second=60

          [android]

          build/min_sdk=21
          build/target_sdk=34
          build/version_code=18
          build/version_name="1.0.18"
          build/package="com.neftegorsk.game"
          build/keystore/debug="user://debug.keystore"
          build/permissions=["android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE", "android.permission.WAKE_LOCK"]
          build/architectures=["arm64-v8a", "armeabi-v7a"]
          GODOTCFG
          # Re-apply export_presets.cfg
          sed -i 's|use_embedded_pck=false|use_embedded_pck=true|' export_presets.cfg
          sed -i 's|script_export_mode=1|script_export_mode=0|g' export_presets.cfg
          sed -i '/gdscript_optimization_level/d' export_presets.cfg
          sed -i 's|runnable=false|runnable=true|g' export_presets.cfg
          sed -i 's|export_path="builds/Neftegorsk.apk"|export_path="Neftegorsk.apk"|g' export_presets.cfg
          sed -i 's|include_filter=""|include_filter="textures.pck"|' export_presets.cfg
          # Re-delete .import files
          find . -name "*.png.import" -type f -delete || true
          find . -name "*.svg.import" -type f -delete || true
          find .godot/imported -name "*.ctex" -type f -delete 2>/dev/null || true
          # Ensure textures.pck exists
          if [ ! -f textures.pck ]; then
            python3 pck_packer.py textures.pck .
          fi
          echo "=== AUTOLOAD SECTION (2 autoloads!) ==="
          grep -A3 "[autoload]" project.godot
          echo "=== KEY SETTINGS ==="
          grep "include_filter" export_presets.cfg
          grep "script_export_mode" export_presets.cfg
          grep "main_scene" project.godot

      - name: Re-inject editor_settings after import
        run: |
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          sed -i '/export\/android\//d' "$SETTINGS"
          echo "export/android/android_sdk_path = \"/opt/android-sdk\"" >> "$SETTINGS"
          echo "export/android/java_sdk_path = \"$JAVA_PATH\"" >> "$SETTINGS"
          echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\"" >> "$SETTINGS"
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> "$SETTINGS"
          echo 'export/android/debug_keystore_pass = "android"' >> "$SETTINGS"
          echo 'export/android/force_system_user = false' >> "$SETTINGS"
          echo 'export/android/timestamping_authority_url = ""' >> "$SETTINGS"
          echo 'export/android/shutdown_adb_on_exit = true' >> "$SETTINGS"

      - name: Export APK
        run: |
          cd ${{ env.PROJECT_PATH }}
          echo "=== Exporting APK ==="
          godot --headless --verbose --export-debug "Android" Neftegorsk.apk 2>&1 | tee export_log.txt
          ls -la *.apk 2>/dev/null || echo "NO APK"
          if [ -f Neftegorsk.apk ]; then
            mkdir -p ../builds
            cp Neftegorsk.apk ../builds/Neftegorsk.apk
            echo "APK exported successfully!"
            du -h ../builds/Neftegorsk.apk
          else
            echo "=== Export failed ==="
            grep -i "texture\|import\|cannot\|error\|fail" export_log.txt | head -30
            exit 1
          fi

      - name: Verify PCK contents
        if: always()
        run: |
          cd ${{ env.PROJECT_PATH }}
          if [ -f Neftegorsk.apk ]; then
            echo "=== Checking PCK contents ==="
            python3 pck_check.py Neftegorsk.apk 2>&1 | head -80 || echo "pck_check.py not available"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Neftegorsk-APK
          path: ${{ env.BUILD_DIR }}/Neftegorsk.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BUILD_DIR }}/Neftegorsk.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
